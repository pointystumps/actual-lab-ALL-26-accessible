version: '3.8'

services:
  nuxt_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=3000
      - HOST=0.0.0.0

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Optional: Share static files directly with Nginx if named volumes are configured
    depends_on:
      - nuxt_app
